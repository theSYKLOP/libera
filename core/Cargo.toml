[package]
name = "libera-core"
version = "0.1.0"
edition = "2021"
authors = ["NGUEME OYONE FRANCK MEHDI"]
license = "GPL-3.0-only"
repository = "https://github.com/theSYKLOP/libera"
readme = "../README.md"
description = "Moteur d'analyse et de nettoyage de disque pour Windows"

[lib]
name = "libera_core"
path = "src/lib.rs"

[[bin]]
# l'outil de test utilise windows-sys directement
name = "libera-cli"
path = "src/bin/cli.rs"

[dependencies]
blake3 = "1.8.7"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Threading", "Win32_System_RestartManager", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Ioctl", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices"] }
winreg = "0.56.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
