<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-labelledby="t d">
  <title id="t">Comment fonctionne l'assistant de Libéra</title>
  <desc id="d">Tu écris une demande, l'assistant utilise des outils sécurisés, remplit le panier, demande l'autorisation quand une protection bloque, et seul l'utilisateur confirme la suppression.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <rect x=".5" y=".5" width="1099" height="329" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="58" font-size="24" font-weight="700" fill="#0f172a">Un assistant qui agit, mais qui demande</text>
    <g font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">
      <g transform="translate(44 100)"><rect width="176" height="92" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="88" y="40">Tu écris</text><text x="88" y="64" font-size="13" font-weight="400" fill="#64748b">« libère 100 Go »</text></g>
      <g transform="translate(262 100)"><rect width="176" height="92" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="88" y="40">Assistant</text><text x="88" y="64" font-size="13" font-weight="400" fill="#64748b">Claude Code, ton abonnement</text></g>
      <g transform="translate(480 100)"><rect width="176" height="92" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="88" y="40">Outils sécurisés</text><text x="88" y="64" font-size="13" font-weight="400" fill="#64748b">analyse, tri, archive, Bureau</text></g>
      <g transform="translate(698 100)"><rect width="176" height="92" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="88" y="40">Panier</text><text x="88" y="64" font-size="13" font-weight="400" fill="#64748b">chaque ligne justifiée</text></g>
      <g transform="translate(916 100)"><rect width="140" height="92" rx="14" fill="#2563eb"/><text x="70" y="40" fill="#fff">Tu confirmes</text><text x="70" y="64" font-size="13" font-weight="400" fill="#dbeafe">seul toi supprimes</text></g>
    </g>
    <g stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a)">
      <path d="M222 146H258"/><path d="M440 146H476"/><path d="M658 146H694"/><path d="M876 146H912"/>
    </g>
    <!-- boucle d'autorisation -->
    <path d="M568 196V236H350V196" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#a)"/>
    <g transform="translate(372 244)"><rect width="176" height="46" rx="23" fill="#dbeafe"/>
      <text x="88" y="29" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Autoriser / Refuser</text></g>
    <text x="570" y="270" font-size="14" fill="#475569">Une protection bloque ? L'assistant te pose la question dans le chat, puis reprend.</text>
  </g>
</svg>
